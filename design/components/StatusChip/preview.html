<head><meta charset="utf-8"><title>StatusChip — preview</title>

<body>
<div id="root" class="fm-row"></div>
<script>
  var F = window.Filamentarium, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(F.StatusChip, { tone: 'shelf' }, 'On the shelf'),
      h(F.StatusChip, { tone: 'loan', dot: true }, 'Printing \u201cBracket v3\u201d \u00b7 1 h 12 m left'),
      h(F.StatusChip, { tone: 'warn' }, 'Due for drying'),
      h(F.StatusChip, null, 'Archived'))
  );
</script>
</body>
