<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">

</head>
<body>
<div id="root" class="fm-row"></div>
<script>
  var F = window.Filamentarium, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(F.Button, { variant: 'primary' }, 'Lend to a printer'),
      h(F.Button, null, 'Record a weigh-in'),
      h(F.Button, { variant: 'quiet' }, 'Add a note'),
      h(F.Button, { variant: 'danger' }, 'Withdraw to the archive'))
  );
</script>
</body>
